<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nordic Chase Series Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #0e1013;
    --panel: rgba(14, 16, 19, 0.88);
    --line: rgba(255, 255, 255, 0.08);
    --text: #eef0f2;
    --muted: #8b929b;
    --accent: #ff6a2b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }

  .legend { position: absolute; top: 16px; left: 16px; z-index: 2; width: 290px; padding: 16px 16px 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .brand { font-size: 11px; letter-spacing: .22em; font-weight: 700; color: var(--accent); text-transform: uppercase; }
  .title { font-size: 20px; font-weight: 700; margin: 4px 0 12px; letter-spacing: -.01em; }
  .row { display: grid; grid-template-columns: 4px 1fr auto; align-items: center; color: inherit; text-decoration: none; gap: 12px; padding: 9px 8px; margin: 0 -8px;
    border-radius: 8px; cursor: pointer; opacity: .35; transition: opacity .4s, background .2s; }
  .row.on { opacity: 1; }
  .row:hover { background: rgba(255,255,255,0.05); }
  .go { font-size: 16px; color: var(--muted); transition: transform .2s, color .2s; }
  .row:hover .go { color: var(--text); transform: translateX(3px); }
  .bar { align-self: stretch; }
  .bar { border-radius: 2px; }
  .tag { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
  .name { font-size: 15px; font-weight: 600; margin: 1px 0 2px; }
  .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .replay { margin-top: 8px; background: none; border: 1px solid var(--line); color: var(--muted);
    font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .replay:hover { color: var(--text); border-color: rgba(255,255,255,.25); }

  .end { width: 12px; height: 12px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 3px rgba(0,0,0,.35); }
  .hub { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 4px solid #111; outline: 2px solid #fff; }
  .head { width: 12px; height: 12px; border-radius: 50%; border: 3px solid #fff; }
  .maplibregl-ctrl-attrib { font-size: 10px; }

  @media (max-width: 600px) {
    .legend { top: auto; bottom: 10px; left: 10px; right: 10px; width: auto; padding: 12px 12px 8px; }
    .title { display: none; }
    .rows { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; margin-top: 6px; }
    .row { padding: 6px 8px; gap: 8px; }
    .go { display: none; }
    .name { font-size: 13px; }
    .meta { font-size: 11px; }
    .replay { margin-top: 4px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="legend">
  <div class="brand">Nordic Chase</div>
  <div class="title">The Chases</div>
  <div class="rows" id="rows"></div>
  <button class="replay" id="replay">↻ Replay</button>
</div>

<script>
const CHASES = /*SERIES_DATA*/;
// colours, names and links come from chases.json
const ANIM_MS = 2600;   // time to draw each route, in milliseconds
const PAUSE_MS = 300;   // pause between routes
// open the Chase page in the main window, also when the map is embedded in an iframe
const openChase = i => window.open(CHASES[i].link, '_top');

const fmt = n => n.toLocaleString('en-US');
const el = (cls, css) => { const d = document.createElement('div'); d.className = cls; if (css) Object.assign(d.style, css); return d; };
const CPH = [12.59, 55.71];
const nearCph = c => Math.hypot((c[0] - CPH[0]) * 0.56, c[1] - CPH[1]) < 0.15;

// legend
const rowsEl = document.getElementById('rows');
CHASES.forEach((c, i) => {
  // distance along the simplified line, for the moving head dot
  c.cum = [0];
  for (let j = 1; j < c.line.length; j++) {
    // measured in Web Mercator, the same way the map measures line progress
    const a = c.line[j - 1], b = c.line[j], my = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) * 180 / Math.PI;
    c.cum.push(c.cum[j - 1] + Math.hypot(b[0] - a[0], my(b[1]) - my(a[1])));
  }
  const r = document.createElement('a');
  r.className = 'row'; r.href = c.link; r.target = '_top';
  r.innerHTML = `<div class="bar" style="background:${c.color}"></div>
    <div><div class="tag">${c.tag}</div><div class="name">${c.name}</div>
    <div class="meta">${fmt(Math.round(c.km))} km · ${fmt(c.ascent)} m</div></div><div class="go">→</div>`;
  r.addEventListener('mouseenter', () => highlight(i));
  r.addEventListener('mouseleave', () => highlight(-1));
  rowsEl.appendChild(r); c.row = r;
});

function boundsOf(line) { return line.reduce((b, p) => b.extend(p), new maplibregl.LngLatBounds(line[0], line[0])); }
function pad() {
  return window.innerWidth <= 600 ? { top: 30, bottom: 190, left: 20, right: 20 }
                                   : { top: 50, bottom: 50, left: 340, right: 60 };
}

// ---------- Map ----------
const allBounds = boundsOf(CHASES.flatMap(c => c.line));
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/dark',
  bounds: allBounds, fitBoundsOptions: { padding: pad() },
  attributionControl: { compact: true },
  cooperativeGestures: window.self !== window.top
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
map.addControl(new maplibregl.FullscreenControl(), 'top-right');

map.on('load', () => {
  // hide borders drawn across sea and lakes
  map.getStyle().layers.filter(l => l['source-layer'] === 'boundary').forEach(l => {
    const f = map.getFilter(l.id);
    map.setFilter(l.id, f ? ['all', f, ['!=', ['get', 'maritime'], 1]] : ['!=', ['get', 'maritime'], 1]);
  });
  CHASES.forEach((c, i) => {
    // one source per route holding both the drawn part of the line and its leading dot, so they always move together
    map.addSource('r' + i, { type: 'geojson', data: frameData(c, 0) });
    const isLine = ['==', ['geometry-type'], 'LineString'], isPt = ['==', ['geometry-type'], 'Point'];
    map.addLayer({ id: 'glow' + i, type: 'line', source: 'r' + i, filter: isLine, layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': c.color, 'line-width': 10, 'line-opacity': 0.25, 'line-blur': 6 } });
    map.addLayer({ id: 'line' + i, type: 'line', source: 'r' + i, filter: isLine, layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': c.color, 'line-width': ['interpolate', ['linear'], ['zoom'], 4, 2.2, 12, 5] } });
    map.addLayer({ id: 'headglow' + i, type: 'circle', source: 'r' + i, filter: isPt,
      paint: { 'circle-radius': 12, 'circle-color': c.color, 'circle-opacity': 0.35, 'circle-blur': 1 } });
    map.addLayer({ id: 'head' + i, type: 'circle', source: 'r' + i, filter: isPt,
      paint: { 'circle-radius': 5, 'circle-color': c.color, 'circle-stroke-width': 2.5, 'circle-stroke-color': '#fff' } });
    map.addLayer({ id: 'hit' + i, type: 'line', source: 'r' + i, paint: { 'line-color': '#000', 'line-opacity': 0, 'line-width': 20 } });
    map.on('mouseenter', 'hit' + i, () => { map.getCanvas().style.cursor = 'pointer'; highlight(i); });
    map.on('mouseleave', 'hit' + i, () => { map.getCanvas().style.cursor = ''; highlight(-1); });
    map.on('click', 'hit' + i, () => openChase(i));

    // end markers in the route colour (Copenhagen gets one shared hub marker)
    c.markers = [];
    [c.line[0], c.line[c.line.length - 1]].forEach((p, k) => {
      if (!nearCph(p)) c.markers.push({ at: k, m: new maplibregl.Marker({ element: el('end', { background: c.color }) }).setLngLat(p) });
    });
  });
  play();
});

const hub = new maplibregl.Marker({ element: el('hub') }).setLngLat(CPH);

function frameData(c, p) {   // the part of the route drawn so far, plus the dot at its tip
  if (p >= 1) return { type: 'FeatureCollection', features: [{ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: c.line } }] };
  if (p <= 0) return { type: 'FeatureCollection', features: [] };
  const target = p * c.cum[c.cum.length - 1];
  let lo = 0, hi = c.cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (c.cum[m] < target) lo = m; else hi = m; }
  const a = c.line[lo], b = c.line[hi], t = c.cum[hi] > c.cum[lo] ? (target - c.cum[lo]) / (c.cum[hi] - c.cum[lo]) : 0;
  const tip = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  return { type: 'FeatureCollection', features: [
    { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: c.line.slice(0, lo + 1).concat([tip]) } },
    { type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: tip } } ] };
}
function setProgress(i, p) {
  const c = CHASES[i];
  map.getSource('r' + i).setData(frameData(c, p));
  if (p > 0) c.row.classList.add('on');
  c.markers.forEach(m => { if ((m.at === 0 && p > 0) || p >= 1) m.m.addTo(map); });
  if (p >= 1 || (p > 0 && nearCph(c.line[0]))) hub.addTo(map);
}
function highlight(i) {
  CHASES.forEach((c, j) => {
    const dim = i >= 0 && i !== j;
    map.setPaintProperty('line' + j, 'line-opacity', dim ? 0.25 : 1);
    map.setPaintProperty('glow' + j, 'line-opacity', dim ? 0.05 : 0.25);
  });
}

let runId = 0;
function play() {
  const id = ++runId;
  hub.remove();
  CHASES.forEach((c, i) => { c.row.classList.remove('on'); c.markers.forEach(m => m.m.remove()); setProgress(i, 0); });
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { CHASES.forEach((c, i) => setProgress(i, 1)); return; }
  const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  const t0 = performance.now(), slot = ANIM_MS + PAUSE_MS;
  (function frame(now) {
    if (id !== runId) return;
    const t = now - t0;
    CHASES.forEach((c, i) => {
      const local = Math.min(1, Math.max(0, (t - i * slot) / ANIM_MS));
      if (local > 0 && !c.done) { setProgress(i, ease(local)); if (local >= 1) c.done = true; }
    });
    if (t < CHASES.length * slot) requestAnimationFrame(frame);
  })(t0);
}
document.getElementById('replay').addEventListener('click', () => {
  CHASES.forEach(c => c.done = false);
  map.fitBounds(allBounds, { padding: pad(), duration: 600 });
  play();
});
</script>
</body>
</html>
